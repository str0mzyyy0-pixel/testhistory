/* ============ ДВИЖОК ============ */
const $=s=>document.querySelector(s),KEY='tarih-v1',L='ABCDE';
let S=null,iv=null,conf=false;
const qsOf=p=>[...BANK.en.map(q=>({...q,s:'en'})),...BANK[p].map(q=>({...q,s:p}))];
function ld(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function sv(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function clr(){try{localStorage.removeItem(KEY)}catch(e){}}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.92;speechSynthesis.speak(u)}catch(e){}}
function hush(){try{speechSynthesis.cancel()}catch(e){}}
const fmt=ms=>{ms=Math.max(0,ms);const s=Math.floor(ms/1000);return[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(x=>String(x).padStart(2,'0')).join(':')};

function home(){
  clearInterval(iv);const old=S&&!S.done;const sel=home.p||'';
  $('#app').innerHTML=`<div class="card">
  <h1>Пробное комплексное тестирование</h1>
  <p class="mu">Английский язык (грамматика, чтение, аудирование) и профильный предмет по истории. Говорения нет. Вопросы закрытые: один верный ответ, 1 балл.</p>
  <div class="pg">${Object.keys(PROG).map(p=>`<button class="pc ${sel==p?'on':''}" data-p="${p}"><b>${p.replace('M','М')}</b><span>${PROG[p].d}</span><span>${PROG[p].h}</span><span>Вопросов в банке: ${BANK.en.length+BANK[p].length}</span></button>`).join('')}</div>
  <div class="hd" style="margin:0"><span class="mu">Время: ${TOTAL_MIN/60} ч. Ответы сохраняются автоматически.</span>
  <span>${old?'<button class="sc" data-a="resume">Продолжить попытку</button> ':''}<button class="pr" data-a="start" ${sel?'':'disabled'}>Начать экзамен</button></span></div></div>`;
}
function exam(){
  const Q=qsOf(S.p),q=Q[S.i],n=Q.length,got=Object.keys(S.a).length,subs=[...new Set(Q.map(x=>x.s))];
  const grid=Q.map((x,k)=>S.only&&!S.f[k]?'':`<button class="nb${S.a[k]!=null?' an':''}${S.f[k]?' fl2':''}${k==S.i?' cu':''}" data-g="${k}" aria-label="Вопрос ${k+1}">${k+1}</button>`).join('');
  $('#app').innerHTML=`<div class="hd"><div><b>${S.p.replace('M','М')} · вариант 1</b><div class="mu">Отвечено ${got} из ${n} · осталось ${n-got}</div></div>
  <div style="display:flex;gap:8px;align-items:center"><button class="sc" data-a="exit">Сохранить и выйти</button><span class="tm" id="tm">${fmt(S.end-Date.now())}</span></div></div>
  <div class="ex"><div class="card">
    <div class="qm"><span>Вопрос ${S.i+1} / ${n} · ${SUB[q.s]} · ${q.tp} · ${q.lv}</span><button class="fl${S.f[S.i]?' on':''}" data-a="flag">${S.f[S.i]?'● Отмечен':'○ Отметить'}</button></div>
    ${q.au?`<div class="au"><button class="sc" data-a="play">▶ Слушать текст</button><button class="sc" data-a="stop">■ Стоп</button></div><div class="mu" style="font-size:12px">Синтез речи браузера — звук нужно включить</div><details><summary>Показать расшифровку (подсказка)</summary><div class="psg">${q.au}</div></details>`:''}
    ${q.p?`<div class="psg">${q.p}</div>`:''}
    <div class="qt">${q.t}</div><div class="mu">Выберите один правильный ответ · 1 балл</div>
    ${q.o.map((t,k)=>`<button class="op${S.a[S.i]===k?' sel':''}" data-k="${k}"><i></i><b>${L[k]}</b>${t}</button>`).join('')}
    <div class="ft"><button class="sc" data-a="reset">Сбросить ответ</button><span><button class="sc" data-a="prev" ${S.i?'':'disabled'}>← Назад</button> <button class="pr" data-a="next" ${S.i<n-1?'':'disabled'}>Далее →</button></span></div>
  </div>
  <div class="card side"><span class="mu">Перейти к предмету</span>
    <select id="sj">${subs.map(s=>`<option value="${s}" ${s==q.s?'selected':''}>${SUB[s]}</option>`).join('')}</select>
    <label class="mu"><input type="checkbox" id="on" ${S.only?'checked':''}> Только отмеченные</label>
    <div class="gr">${grid||'<span class="mu">Нет отмеченных</span>'}</div>
    <div class="lgd">Зелёный — ответ сохранён · Точка — отмечен для проверки · Золотая рамка — текущий</div>
    <button class="pr" style="width:100%" data-a="fin">${conf?`Точно завершить? Без ответа: ${n-got}`:'Завершить экзамен'}</button>
  </div></div>`;
}
function result(){
  clearInterval(iv);hush();const Q=qsOf(S.p),by={};let tot=0;
  Q.forEach((q,k)=>{const b=by[q.s]=by[q.s]||{c:0,n:0};b.n++;if(S.a[k]===q.a){b.c++;tot++}});
  $('#app').innerHTML=`<div class="card"><h1>Результат: ${tot} из ${Q.length}</h1><p class="mu">${S.p.replace('M','М')} · ${Math.round(tot/Q.length*100)}%</p>
  ${Object.keys(by).map(s=>`<div>${SUB[s]}: <b>${by[s].c} / ${by[s].n}</b></div><div class="bar"><i style="width:${by[s].c/by[s].n*100}%"></i></div>`).join('')}
  <button class="pr" data-a="home">На главную</button></div>
  <h2 style="font-family:Georgia,serif">Разбор ответов</h2>${Q.map((q,k)=>{const ok=S.a[k]===q.a;return`<div class="rv${ok?' ok':''}"><b>${k+1}.</b> ${q.t}<br><span class="mu">Ваш ответ: ${S.a[k]==null?'—':L[S.a[k]]+') '+q.o[S.a[k]]} · Верный: ${L[q.a]}) ${q.o[q.a]}</span></div>`}).join('')}`;
}
function view(){S&&S.done?result():exam()}
function run(){clearInterval(iv);iv=setInterval(()=>{const l=S.end-Date.now();if(l<=0){fin();return}const e=$('#tm');if(e)e.textContent=fmt(l)},1000)}
function fin(){S.done=true;conf=false;sv();result()}
function go(k){hush();S.i=k;conf=false;sv();exam()}

document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  if(d.p){home.p=d.p;home();return}
  if(d.k!==undefined){S.a[S.i]=+d.k;conf=false;sv();exam();return}
  if(d.g!==undefined){go(+d.g);return}
  switch(d.a){
    case'start':S={p:home.p,a:{},f:{},i:0,end:Date.now()+TOTAL_MIN*6e4,done:false,only:false};sv();exam();run();break;
    case'resume':exam();run();break;
    case'next':go(S.i+1);break;case'prev':go(S.i-1);break;
    case'reset':delete S.a[S.i];sv();exam();break;
    case'flag':S.f[S.i]=!S.f[S.i];sv();exam();break;
    case'play':say(qsOf(S.p)[S.i].au);break;case'stop':hush();break;
    case'exit':hush();clearInterval(iv);sv();home();break;
    case'fin':if(conf)fin();else{conf=true;exam()}break;
    case'home':clr();S=null;home.p='';home();break;
  }
});
document.addEventListener('change',e=>{
  if(e.target.id=='sj')go(qsOf(S.p).findIndex(q=>q.s==e.target.value));
  if(e.target.id=='on'){S.only=e.target.checked;exam()}
});
$('#th').onclick=()=>{const r=document.documentElement,d=r.dataset.theme=='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'};
S=ld();if(S&&S.done)S=null;
if(S&&Date.now()>S.end){S.done=true;sv();result()}else home();
</script>
